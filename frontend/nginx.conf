# nginx site config for the FireLink frontend container.

server {
    listen 80;

    # Where the built React files live (copied in by the Dockerfile).
    root  /usr/share/nginx/html;
    index index.html;

    # --- SPA routing ---
    # React Router handles routes like /dashboard and /inventory on the client.
    # There are no such files on disk, so for any path that isn't a real file we
    # serve index.html and let React take over. Without this, a hard refresh on
    # /dashboard would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API proxy ---
    # The app's shared axios instance (services/api.js) calls the backend with a
    # RELATIVE "/api" base. In dev, Vite proxies that; in production, nginx does.
    # Forward anything under /api to the backend container over the internal
    # Docker network — "backend" is the compose service name.
    #
    # We deliberately proxy ONLY /api. The app's other backend routes
    # (/users, /sessions, /attendance, ...) are called with an absolute
    # http://localhost:5000 URL and go straight to the backend — proxying them
    # here would collide with the client-side /sessions and /attendance routes.
    #
    # No trailing slash on proxy_pass: the full "/api/..." path is passed through
    # unchanged. Adding a slash would strip the "/api" prefix and break routing.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
